<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>MEXC bonus</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --abyss:#040A1E;
    --navy:#0A1B4D;
    --royal:#1E4FD8;
    --electric:#3D8BFF;
    --ice:#BFD8FF;
    --muted:#8FA6D6;
    --p:0;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%;background:var(--abyss)}
  body{
    font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:#fff;
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(61,139,255,.35) 0%, rgba(61,139,255,0) 60%),
      linear-gradient(180deg,#071443 0%,#040A1E 70%);
    background-attachment:fixed;
    padding:max(20px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));
    display:flex;justify-content:center;
  }
  .wrap{width:100%;max-width:440px;display:flex;flex-direction:column;gap:18px}
  h1{font-size:15px;font-weight:700;color:var(--ice);letter-spacing:.2px}
  .sub{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4}

  .hero{
    border-radius:24px;padding:22px 20px 18px;
    background:linear-gradient(145deg,rgba(30,79,216,.55) 0%,rgba(10,27,77,.75) 55%,rgba(4,10,30,.9) 100%);
    border:1px solid rgba(143,166,214,.22);
    box-shadow:0 18px 50px -20px rgba(61,139,255,.55), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .hero .label{font-size:13px;color:var(--muted)}
  .bonus{
    font-size:54px;font-weight:800;line-height:1.05;margin:6px 0 2px;
    font-variant-numeric:tabular-nums;
    background:linear-gradient(95deg,#fff 0%,var(--ice) 35%,var(--electric) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .rate{font-size:15px;font-weight:700;color:var(--electric);font-variant-numeric:tabular-nums}

  .curve{margin-top:14px;height:96px;position:relative}
  .curve svg{width:100%;height:100%;overflow:visible;display:block}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .stat{padding:12px 14px;border-radius:16px;background:rgba(4,10,30,.55);border:1px solid rgba(143,166,214,.16)}
  .stat .k{font-size:12px;color:var(--muted)}
  .stat .v{font-size:19px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}

  .panel{padding:4px 2px 0}
  .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  .row .k{font-size:13px;color:var(--muted)}
  .row .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}

  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:10px;border-radius:10px;
    background:linear-gradient(90deg,var(--royal) 0%,var(--electric) calc(var(--p)*1%),rgba(143,166,214,.18) calc(var(--p)*1%),rgba(143,166,214,.18) 100%);
  }
  input[type=range]::-moz-range-track{height:10px;border-radius:10px;background:rgba(143,166,214,.18)}
  input[type=range]::-moz-range-progress{height:10px;border-radius:10px;background:linear-gradient(90deg,var(--royal),var(--electric))}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:30px;height:30px;border-radius:50%;margin-top:-10px;
    background:radial-gradient(circle at 35% 30%,#fff 0%,var(--ice) 45%,var(--electric) 100%);
    border:3px solid var(--abyss);
    box-shadow:0 0 0 2px var(--electric),0 6px 22px rgba(61,139,255,.75);
  }
  input[type=range]::-moz-range-thumb{
    width:24px;height:24px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff 0%,var(--ice) 45%,var(--electric) 100%);
    border:3px solid var(--abyss);box-shadow:0 0 0 2px var(--electric),0 6px 22px rgba(61,139,255,.75);
  }
  input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px #fff,0 6px 22px rgba(61,139,255,.75)}
  .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:2px}

  .chips{display:flex;gap:8px;margin-top:14px}
  .chip{
    flex:1;padding:10px 0;border-radius:12px;border:1px solid rgba(143,166,214,.25);
    background:rgba(10,27,77,.5);color:var(--ice);font:700 14px 'Manrope',sans-serif;cursor:pointer;
    transition:background .2s,border-color .2s;
  }
  .chip:active,.chip.on{background:linear-gradient(135deg,var(--royal),var(--electric));border-color:transparent;color:#fff}

  .cap{margin-top:12px;font-size:12px;color:var(--muted);transition:color .2s}
  .cap.hit{color:var(--ice);font-weight:700}
  .spins{margin-top:20px}
  .spins .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .spins .k{font-size:13px;color:var(--muted)}
  .spins .lim{font-size:12px;color:var(--ice);opacity:.85}
  .sp{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .sp button{
    padding:12px 0;border-radius:12px;border:1px solid rgba(143,166,214,.25);
    background:rgba(10,27,77,.5);color:var(--ice);font:800 16px 'Manrope',sans-serif;cursor:pointer;
    transition:background .2s,border-color .2s;
  }
  .sp button.on{background:linear-gradient(135deg,var(--royal),var(--electric));border-color:transparent;color:#fff;box-shadow:0 8px 20px -8px rgba(61,139,255,.8)}
  .offer{
    border-radius:22px;padding:20px 18px;
    background:linear-gradient(160deg,rgba(30,79,216,.30) 0%,rgba(10,27,77,.55) 60%,rgba(4,10,30,.7) 100%);
    border:1px solid rgba(143,166,214,.2);
  }
  .offer h2{font-size:16px;font-weight:800;margin-bottom:12px;color:#fff}
  .offer h3{font-size:13px;font-weight:700;color:var(--ice);margin:18px 0 8px}
  .offer ol,.offer ul{list-style:none;counter-reset:n;display:flex;flex-direction:column;gap:10px}
  .offer ol li{counter-increment:n;position:relative;padding-left:38px;font-size:14px;line-height:1.45;color:#E6EEFF}
  .offer ol li::before{
    content:counter(n);position:absolute;left:0;top:-1px;width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;
    background:linear-gradient(135deg,var(--royal),var(--electric));box-shadow:0 6px 16px -6px rgba(61,139,255,.9);
  }
  .offer ul li{position:relative;padding-left:22px;font-size:14px;line-height:1.45;color:#E6EEFF}
  .offer ul li::before{content:"";position:absolute;left:4px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--electric);box-shadow:0 0 10px var(--electric)}
  .offer p{font-size:14px;line-height:1.5;color:#E6EEFF}
  .offer .who{margin-top:12px;font-size:12.5px;color:var(--muted)}
  .ghost{
    width:100%;padding:13px;border-radius:14px;cursor:pointer;
    font:700 14px 'Manrope',sans-serif;color:var(--ice);
    background:rgba(10,27,77,.35);border:1px solid rgba(143,166,214,.25);
    transition:background .2s,border-color .2s;
  }
  .ghost:active{background:rgba(30,79,216,.35);border-color:rgba(61,139,255,.6)}
  .status{min-height:18px;text-align:center;font-size:13px;color:var(--ice);margin-top:-8px}
  .status.err{color:#FFB4B4}
  .cta:disabled{opacity:.7;cursor:default}
  .cta{
    width:100%;padding:17px;border:0;border-radius:18px;cursor:pointer;
    font:800 17px 'Manrope',sans-serif;color:#fff;
    background:linear-gradient(95deg,var(--royal) 0%,var(--electric) 100%);
    box-shadow:0 14px 34px -10px rgba(61,139,255,.8);
    transition:transform .15s,box-shadow .15s;
  }
  .cta:active{transform:scale(.985);box-shadow:0 8px 20px -10px rgba(61,139,255,.8)}
  .note{font-size:11.5px;line-height:1.5;color:var(--muted);text-align:center}
  .note a{color:var(--ice)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1 id="t_title"></h1>
    <p class="sub" id="t_sub"></p>
  </div>

  <section class="hero">
    <div class="label" id="t_bonus"></div>
    <div class="bonus" id="bonus">$0</div>

</div>

<script>
/* ---------- Настройки (меняйте под реальные условия акции) ---------- */
const MANAGER_URL = "https://t.me/Mostex_TH?text=Hi";   // личка менеджера, в поле ввода сразу стоит «Hi»
// [сумма депозита $, процент бонуса]. Кривая плавно проходит через эти точки.
const ANCHORS = [[10,3.0],[50,3.0],[100,3.8],[316,5.6],[1000,8.9],[10000,9.8]];
const MIN = 10, MAX = 10000;
const BONUS_CAP = 2000;   // максимум вознаграждения, $
const MAX_SPINS = 5;   // лимит прокруток на одну биржу
let spins = 1;
const state = {dep:0, bonus:0, calcSent:0, timer:null};

/* ---------- Тексты ---------- */
const I18N = {
  ru:{title:"Бонус за пополнение на MEXC",sub:"Двигайте ползунок: чем больше сумма, тем выше процент.",bonus:"Ожидаемый бонус",dep:"Пополнение",total:"Итого на счёте",cta:"Начать на MEXC",note:"Пишите в личные сообщения менеджера или смотрите в описании бота.",promo:"Условия акции",rate:"бонус",cap:"Вознаграждение не больше $2 000",spins:"Количество прокруток",lim:"максимум 5 на одну биржу",per:"за прокрутку",send:"Получить связку в чат",sending:"Отправляю…",sent:"Отправил в чат с ботом",err:"Не получилось. Нажмите /start в боте и повторите.",mgr:"Написать менеджеру @Mostex_TH",noTg:"Откройте калькулятор через Telegram.",offer:{
    title:"Как работает связка",
    steps:["Регистрируетесь на бирже по моей реферальной ссылке.","Пополняете счёт от $10 и переводите средства с Bithumb на MEXC.","MEXC начисляет бонус по акции: чем больше сумма, тем выше процент (примерно от 3% до 9,8%). Посчитайте в калькуляторе выше.","Можно повторить до 5 прокруток на одну биржу, вознаграждение не больше $2 000."],
    elT:"Кто может стать моим рефералом",
    el:["вы ещё не зарегистрированы на бирже","вы зарегистрированы, но не вводили реферальный код","вы вводили реферальный код не позднее 1 года назад"],
    goalT:"Моя цель",
    goal:"Мне нужно набрать оборот $100k до конца месяца. Если вы даёте большой оборот, я готов поделиться частью своего вознаграждения. Условия обсудим лично.",
    who:"Я мерчант Bithumb и получаю вознаграждение от биржи за приведённых клиентов."
  }},
  en:{title:"MEXC deposit bonus",sub:"Move the slider: the larger the deposit, the higher the rate.",bonus:"Estimated bonus",dep:"Deposit",total:"Total in account",cta:"Start on MEXC",note:"Message the manager directly or see the bot description.",promo:"Promo terms",rate:"bonus",cap:"Reward is capped at $2,000",spins:"Number of rounds",lim:"max 5 per exchange",per:"per round",send:"Get the guide in chat",sending:"Sending…",sent:"Sent to your chat with the bot",err:"Something went wrong. Press /start in the bot and try again.",mgr:"Message the manager @Mostex_TH",noTg:"Open the calculator inside Telegram.",offer:{
    title:"How it works",
    steps:["Register on the exchange through my referral link.","Deposit from $10 and transfer funds from Bithumb to MEXC.","MEXC credits a promo bonus: the larger the amount, the higher the rate (roughly 3% to 9.8%). Check it in the calculator above.","You can repeat up to 5 rounds per exchange, and the reward is capped at $2,000."],
    elT:"Who can become my referral",
    el:["you are not registered on the exchange yet","you are registered but never entered a referral code","you entered a referral code no more than 1 year ago"],
    goalT:"My goal",
    goal:"I need to reach $100k turnover by the end of the month. If you bring a large volume, I am ready to share part of my reward. We will agree on terms personally.",
    who:"I am a Bithumb merchant and receive a reward from the exchange for referred clients."
  }},
  ko:{title:"MEXC 입금 보너스",sub:"슬라이더를 움직이세요. 입금액이 클수록 보너스율이 높아집니다.",bonus:"예상 보너스",dep:"입금액",total:"계좌 합계",cta:"MEXC에서 시작하기",note:"매니저에게 개인 메시지를 보내거나 봇 설명을 확인하세요.",promo:"이벤트 조건",rate:"보너스",cap:"보상은 최대 $2,000까지입니다",spins:"반복 횟수",lim:"거래소당 최대 5회",per:"회당",send:"가이드를 채팅으로 받기",sending:"전송 중…",sent:"봇 채팅으로 보냈습니다",err:"실패했습니다. 봇에서 /start를 누르고 다시 시도하세요.",mgr:"매니저에게 문의 @Mostex_TH",noTg:"텔레그램에서 계산기를 열어주세요.",offer:{
    title:"연결 방식 안내",
    steps:["제 추천 링크로 거래소에 가입합니다.","$10 이상 입금하고 Bithumb에서 MEXC로 자금을 이체합니다.","MEXC가 이벤트에 따라 보너스를 지급합니다. 금액이 클수록 보너스율이 높아집니다(약 3%~9.8%). 위 계산기로 확인하세요.","거래소당 최대 5회 반복할 수 있으며, 보상은 최대 $2,000입니다."],
    elT:"추천인이 될 수 있는 경우",
    el:["아직 거래소에 가입하지 않았다","가입했지만 추천 코드를 입력하지 않았다","추천 코드를 입력한 지 1년이 지나지 않았다"],
    goalT:"제 목표",
    goal:"이번 달 거래량 $100k를 채워야 합니다. 큰 거래량을 가져오시는 분과는 보상의 일부를 나눌 용의가 있습니다. 조건은 개별적으로 협의합니다.",
    who:"저는 Bithumb 머천트이며 거래소로부터 소개 고객에 대한 보상을 받습니다."
  }}
};
const tg = window.Telegram && Telegram.WebApp;
let lang = ((tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || navigator.language || "ru").slice(0,2);
if(!I18N[lang]) lang = ["ru","uk","be","kk"].includes(lang) ? "ru" : "en";
const T = I18N[lang];
document.documentElement.lang = lang;

/* ---------- Плавная кривая (монотонный кубический Эрмит в лог-шкале) ---------- */
function makeCurve(pts){
  const n=pts.length, x=pts.map(p=>Math.log10(p[0])), y=pts.map(p=>p[1]);
  const h=[], d=[];
  for(let i=0;i<n-1;i++){h[i]=x[i+1]-x[i]; d[i]=(y[i+1]-y[i])/h[i];}
  const m=new Array(n); m[0]=d[0]; m[n-1]=d[n-2];
  for(let i=1;i<n-1;i++){
    if(d[i-1]*d[i]<=0){m[i]=0;}
    else{const w1=2*h[i]+h[i-1], w2=h[i]+2*h[i-1]; m[i]=(w1+w2)/(w1/d[i-1]+w2/d[i]);}
  }
  return v=>{
    const lx=Math.min(Math.max(Math.log10(v),x[0]),x[n-1]);
    let i=0; while(i<n-2 && lx>x[i+1]) i++;
    const t=(lx-x[i])/h[i], t2=t*t, t3=t2*t;
    return (2*t3-3*t2+1)*y[i] + (t3-2*t2+t)*h[i]*m[i] + (-2*t3+3*t2)*y[i+1] + (t3-t2)*h[i]*m[i+1];
  };
}
const pct = makeCurve(ANCHORS);

/* ---------- Вспомогательное ---------- */
const $ = id => document.getElementById(id);
const fmtInt = v => "$" + Math.round(v).toLocaleString("en-US").replace(/,/g," ");
const fmt2 = v => "$" + v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/,/g," ");
const fromSlider = s => MIN*Math.pow(MAX/MIN, s/1000);
const toSlider = v => 1000*Math.log(v/MIN)/Math.log(MAX/MIN);
function nice(v){ return v<50 ? Math.round(v) : v<500 ? Math.round(v/5)*5 : v<2000 ? Math.round(v/10)*10 : Math.round(v/50)*50; }

/* ---------- Подписи ---------- */
$("t_title").textContent=T.title; $("t_sub").textContent=T.sub; $("t_bonus").textContent=T.bonus;
$("t_dep").textContent=T.dep; $("t_dep2").textContent=T.dep; $("t_total").textContent=T.total;
$("cap").textContent=T.cap; $("t_spins").textContent=T.spins; $("t_lim").textContent=T.lim;
const O=T.offer;
$("o_title").textContent=O.title;
$("o_steps").innerHTML=O.steps.map(x=>"<li>"+x+"</li>").join("");
$("o_el_t").textContent=O.elT;
$("o_el").innerHTML=O.el.map(x=>"<li>"+x+"</li>").join("");
$("o_goal_t").textContent=O.goalT; $("o_goal").textContent=O.goal; $("o_who").textContent=O.who;
$("send").textContent=T.send; $("mgr").textContent=T.mgr; $("t_note").textContent=T.note;

/* ---------- Кривая на графике ---------- */
const svg=$("curve"), W=400, H=96, PAD=8, YMIN=2.5, YMAX=10.2;
const px = s => (s/1000)*W;
const py = p => H-PAD-((p-YMIN)/(YMAX-YMIN))*(H-2*PAD);
let path="";
for(let s=0;s<=1000;s+=5){ path += (s?"L":"M")+px(s).toFixed(1)+" "+py(pct(fromSlider(s))).toFixed(1)+" "; }
svg.innerHTML =
  '<defs>'+
   '<linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#1E4FD8"/><stop offset="1" stop-color="#7DB6FF"/></linearGradient>'+
   '<linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3D8BFF" stop-opacity=".45"/><stop offset="1" stop-color="#3D8BFF" stop-opacity="0"/></linearGradient>'+
   '<clipPath id="cl"><rect id="clr" x="0" y="0" width="0" height="'+H+'"/></clipPath>'+
  '</defs>'+
  '<path d="'+path+'" fill="none" stroke="rgba(143,166,214,.28)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>'+
  '<g clip-path="url(#cl)"><path d="'+path+'L'+W+' '+H+' L0 '+H+' Z" fill="url(#fg)"/>'+
  '<path d="'+path+'" fill="none" stroke="url(#lg)" stroke-width="3.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/></g>'+
  '<line id="vl" x1="0" x2="0" y1="0" y2="'+H+'" stroke="rgba(191,216,255,.25)" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>';
const dot=document.createElement("div");
dot.style.cssText="position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(61,139,255,.45),0 0 18px #3D8BFF;transform:translate(-50%,-50%);pointer-events:none";
document.querySelector(".curve").appendChild(dot);

/* ---------- Обновление ---------- */
const slider=$("slider");
function render(){
  const s=+slider.value, dep=nice(fromSlider(s)), p=pct(dep), raw=dep*p/100*spins, bonus=Math.min(raw,BONUS_CAP);
  $("bonus").textContent = bonus<100 ? fmt2(bonus) : fmtInt(bonus);
  $("rate").textContent = "≈ " + p.toFixed(1).replace(".",",") + "% " + T.per + (spins>1 ? "  ×  " + spins : "");
  state.dep=dep; state.bonus=bonus;
  $("dep").textContent = fmtInt(dep); $("dep2").textContent = fmtInt(dep);
  $("total").textContent = fmtInt(dep+bonus);
  slider.style.setProperty("--p", s/10);
  const x=px(s), y=py(pct(fromSlider(s)));
  $("clr").setAttribute("width",x); $("vl").setAttribute("x1",x); $("vl").setAttribute("x2",x);
  const box=document.querySelector(".curve").getBoundingClientRect();
  dot.style.left=(x/W*box.width)+"px"; dot.style.top=(y/H*box.height)+"px";
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",Math.abs(+c.dataset.s-s)<6));
  if(tg && tg.HapticFeedback && render.last!==dep && Math.abs((render.hap||0)-s)>12){ tg.HapticFeedback.selectionChanged(); render.hap=s; }
  $("cap").classList.toggle("hit",raw>=BONUS_CAP);
  document.querySelectorAll("#sp button").forEach(b=>b.classList.toggle("on",+b.dataset.n===spins));
  render.last=dep;
}
slider.addEventListener("input",render);
slider.addEventListener("input",()=>scheduleCalc());
window.addEventListener("resize",render);

/* Быстрые суммы с плавным движением ползунка */
[10,100,1000,10000].forEach(v=>{
  const b=document.createElement("button"); b.className="chip"; b.dataset.s=toSlider(v);
  b.textContent=v>=1000 ? "$"+(v/1000)+"k" : "$"+v;
  b.onclick=()=>{ glide(toSlider(v)); scheduleCalc(); };
  $("chips").appendChild(b);
});
let raf;
function glide(target){
  cancelAnimationFrame(raf);
  const from=+slider.value, t0=performance.now(), dur=window.matchMedia("(prefers-reduced-motion:reduce)").matches?0:450;
  (function step(now){
    const k=dur?Math.min((now-t0)/dur,1):1, e=1-Math.pow(1-k,3);
    slider.value=from+(target-from)*e; render();
    if(k<1) raf=requestAnimationFrame(step);
  })(t0);
}

for(let n=1;n<=MAX_SPINS;n++){
  const b=document.createElement("button"); b.dataset.n=n; b.textContent=n;
  b.onclick=()=>{ spins=Math.min(n,MAX_SPINS); if(tg&&tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); render(); scheduleCalc(); };
  $("sp").appendChild(b);
}

/* Метрики: события уходят на сервер бота, а он присылает их владельцу */
function track(ev,data){
  if(!tg || !tg.initData) return;
  try{
    fetch("/api/event",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({initData:tg.initData,event:ev,data:data||{}}),keepalive:true}).catch(()=>{});
  }catch(e){}
}
function scheduleCalc(){          // одно событие «считал» после паузы, не больше 5 за сеанс
  clearTimeout(state.timer);
  state.timer=setTimeout(()=>{
    if(state.calcSent>=5) return;
    state.calcSent++;
    track("calc",{deposit:state.dep,spins:spins,bonus:state.bonus});
  },2500);
}

const statusEl=$("status");
function setStatus(t,err){ statusEl.textContent=t||""; statusEl.classList.toggle("err",!!err); }

/* Кнопка «Получить связку в чат»: сервер бота сам присылает человеку видео и сообщение */
$("send").onclick=async()=>{
  const btn=$("send");
  if(!tg || !tg.initData){ setStatus(T.noTg,true); return; }
  btn.disabled=true; setStatus(T.sending,false);
  try{
    const r=await fetch("/api/offer",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:tg.initData})});
    const j=await r.json();
    if(j.ok){
      setStatus(T.sent,false);
      if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
      setTimeout(()=>{ try{ tg.close(); }catch(e){} },900);
    }else{ setStatus(T.err,true); btn.disabled=false; }
  }catch(e){ setStatus(T.err,true); btn.disabled=false; }
};

/* Нижняя кнопка: личка менеджера, в поле ввода уже стоит «Hi» */
$("mgr").onclick=()=>{
  track("mgr");
  if(tg && tg.openTelegramLink) tg.openTelegramLink(MANAGER_URL); else window.open(MANAGER_URL,"_blank");
};

if(tg){ tg.ready(); tg.expand(); try{ tg.setHeaderColor("#040A1E"); tg.setBackgroundColor("#040A1E"); }catch(e){} }
slider.value=toSlider(100);
render();
track("open");
</script>
</body>
</html>
