<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>MEXC bonus</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --abyss:#040A1E;
    --navy:#0A1B4D;
    --royal:#1E4FD8;
    --electric:#3D8BFF;
    --ice:#BFD8FF;
    --muted:#8FA6D6;
    --p:0;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%;background:var(--abyss)}
  body{
    font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:#fff;
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(61,139,255,.35) 0%, rgba(61,139,255,0) 60%),
      linear-gradient(180deg,#071443 0%,#040A1E 70%);
    background-attachment:fixed;
    padding:max(20px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));
    display:flex;justify-content:center;
  }
  .wrap{width:100%;max-width:440px;display:flex;flex-direction:column;gap:18px}
  h1{font-size:15px;font-weight:700;color:var(--ice);letter-spacing:.2px}
  .sub{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4}

  .hero{
    border-radius:24px;padding:22px 20px 18px;
    background:linear-gradient(145deg,rgba(30,79,216,.55) 0%,rgba(10,27,77,.75) 55%,rgba(4,10,30,.9) 100%);
    border:1px solid rgba(143,166,214,.22);
    box-shadow:0 18px 50px -20px rgba(61,139,255,.55), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .hero .label{font-size:13px;color:var(--muted)}
  .bonus{
    font-size:54px;font-weight:800;line-height:1.05;margin:6px 0 2px;
    font-variant-numeric:tabular-nums;
    background:linear-gradient(95deg,#fff 0%,var(--ice) 35%,var(--electric) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .rate{font-size:15px;font-weight:700;color:var(--electric);font-variant-numeric:tabular-nums}

  .curve{margin-top:14px;height:96px;position:relative}
  .curve svg{width:100%;height:100%;overflow:visible;display:block}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .stat{padding:12px 14px;border-radius:16px;background:rgba(4,10,30,.55);border:1px solid rgba(143,166,214,.16)}
  .stat .k{font-size:12px;color:var(--muted)}
  .stat .v{font-size:19px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}

  .panel{padding:4px 2px 0}
  .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  .row .k{font-size:13px;color:var(--muted)}
  .row .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}

  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:10px;border-radius:10px;
    background:linear-gradient(90deg,var(--royal) 0%,var(--electric) calc(var(--p)*1%),rgba(143,166,214,.18) calc(var(--p)*1%),rgba(143,166,214,.18) 100%);
  }
  input[type=range]::-moz-range-track{height:10px;border-radius:10px;background:rgba(143,166,214,.18)}
  input[type=range]::-moz-range-progress{height:10px;border-radius:10px;background:linear-gradient(90deg,var(--royal),var(--electric))}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:30px;height:30px;border-radius:50%;margin-top:-10px;
    background:radial-gradient(circle at 35% 30%,#fff 0%,var(--ice) 45%,var(--electric) 100%);
    border:3px solid var(--abyss);
    box-shadow:0 0 0 2px var(--electric),0 6px 22px rgba(61,139,255,.75);
  }
  input[type=range]::-moz-range-thumb{
    width:24px;height:24px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff 0%,var(--ice) 45%,var(--electric) 100%);
    border:3px solid var(--abyss);box-shadow:0 0 0 2px var(--electric),0 6px 22px rgba(61,139,255,.75);
  }
  input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px #fff,0 6px 22px rgba(61,139,255,.75)}
  .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:2px}

  .chips{display:flex;gap:8px;margin-top:14px}
  .chip{
    flex:1;padding:10px 0;border-radius:12px;border:1px solid rgba(143,166,214,.25);
    background:rgba(10,27,77,.5);color:var(--ice);font:700 14px 'Manrope',sans-serif;cursor:pointer;
    transition:background .2s,border-color .2s;
  }
  .chip:active,.chip.on{background:linear-gradient(135deg,var(--royal),var(--electric));border-color:transparent;color:#fff}

  .cap{margin-top:12px;font-size:12px;color:var(--muted);transition:color .2s}
  .cap.hit{color:var(--ice);font-weight:700}
  .spins{margin-top:20px}
  .spins .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .spins .k{font-size:13px;color:var(--muted)}
  .spins .lim{font-size:12px;color:var(--ice);opacity:.85}
  .sp{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .sp button{
    padding:12px 0;border-radius:12px;border:1px solid rgba(143,166,214,.25);
    background:rgba(10,27,77,.5);color:var(--ice);font:800 16px 'Manrope',sans-serif;cursor:pointer;
    transition:background .2s,border-color .2s;
  }
  .sp button.on{background:linear-gradient(135deg,var(--royal),var(--electric));border-color:transparent;color:#fff;box-shadow:0 8px 20px -8px rgba(61,139,255,.8)}
  .cta{
    width:100%;padding:17px;border:0;border-radius:18px;cursor:pointer;
    font:800 17px 'Manrope',sans-serif;color:#fff;
    background:linear-gradient(95deg,var(--royal) 0%,var(--electric) 100%);
    box-shadow:0 14px 34px -10px rgba(61,139,255,.8);
    transition:transform .15s,box-shadow .15s;
  }
  .cta:active{transform:scale(.985);box-shadow:0 8px 20px -10px rgba(61,139,255,.8)}
  .note{font-size:11.5px;line-height:1.5;color:var(--muted);text-align:center}
  .note a{color:var(--ice)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1 id="t_title"></h1>
    <p class="sub" id="t_sub"></p>
  </div>

  <section class="hero">
    <div class="label" id="t_bonus"></div>
    <div class="bonus" id="bonus">$0</div>
    <div class="rate" id="rate"></div>
    <div class="curve"><svg id="curve" viewBox="0 0 400 96" preserveAspectRatio="none"></svg></div>
    <div class="stats">
      <div class="stat"><div class="k" id="t_dep"></div><div class="v" id="dep">$0</div></div>
      <div class="stat"><div class="k" id="t_total"></div><div class="v" id="total">$0</div></div>
    </div>
    <div class="cap" id="cap"></div>
  </section>

  <section class="panel">
    <div class="row"><span class="k" id="t_dep2"></span><span class="v" id="dep2">$0</span></div>
    <input id="slider" type="range" min="0" max="1000" step="1" value="500" aria-label="deposit">
    <div class="ends"><span>$10</span><span>$10 000</span></div>
    <div class="chips" id="chips"></div>
    <div class="spins">
      <div class="top"><span class="k" id="t_spins"></span><span class="lim" id="t_lim"></span></div>
      <div class="sp" id="sp"></div>
    </div>
  </section>

  <button class="cta" id="cta"></button>
  <p class="note"><span id="t_note"></span> <a id="promo" href="#" target="_blank" rel="noopener"></a></p>
</div>

<script>
/* ---------- Настройки (меняйте под реальные условия акции) ---------- */
const REF_LINK  = "__REF_LINK__";
const CTA_URL   = "__CTA_URL__";   // куда ведёт кнопка: ссылка t.me/... (менеджер или бот) или обычная ссылка
const PROMO_URL = "__PROMO_URL__";
// [сумма депозита $, процент бонуса]. Кривая плавно проходит через эти точки.
const ANCHORS = [[10,3.0],[50,3.0],[100,3.8],[316,5.6],[1000,8.9],[10000,9.8]];
const MIN = 10, MAX = 10000;
const BONUS_CAP = 2000;   // максимум вознаграждения, $
const MAX_SPINS = 5;   // лимит прокруток на одну биржу
let spins = 1;

/* ---------- Тексты ---------- */
const I18N = {
  ru:{title:"Бонус за пополнение на MEXC",sub:"Двигайте ползунок: чем больше сумма, тем выше процент.",bonus:"Ожидаемый бонус",dep:"Пополнение",total:"Итого на счёте",cta:"Начать на MEXC",note:"Пишите в личные сообщения менеджера или смотрите в описании бота.",promo:"Условия акции",rate:"бонус",cap:"Вознаграждение не больше $2 000",spins:"Количество прокруток",lim:"максимум 5 на одну биржу",per:"за прокрутку"},
  en:{title:"MEXC deposit bonus",sub:"Move the slider: the larger the deposit, the higher the rate.",bonus:"Estimated bonus",dep:"Deposit",total:"Total in account",cta:"Start on MEXC",note:"Message the manager directly or see the bot description.",promo:"Promo terms",rate:"bonus",cap:"Reward is capped at $2,000",spins:"Number of rounds",lim:"max 5 per exchange",per:"per round"},
  ko:{title:"MEXC 입금 보너스",sub:"슬라이더를 움직이세요. 입금액이 클수록 보너스율이 높아집니다.",bonus:"예상 보너스",dep:"입금액",total:"계좌 합계",cta:"MEXC에서 시작하기",note:"매니저에게 개인 메시지를 보내거나 봇 설명을 확인하세요.",promo:"이벤트 조건",rate:"보너스",cap:"보상은 최대 $2,000까지입니다",spins:"반복 횟수",lim:"거래소당 최대 5회",per:"회당"}
};
const tg = window.Telegram && Telegram.WebApp;
let lang = ((tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || navigator.language || "ru").slice(0,2);
if(!I18N[lang]) lang = ["ru","uk","be","kk"].includes(lang) ? "ru" : "en";
const T = I18N[lang];
document.documentElement.lang = lang;

/* ---------- Плавная кривая (монотонный кубический Эрмит в лог-шкале) ---------- */
function makeCurve(pts){
  const n=pts.length, x=pts.map(p=>Math.log10(p[0])), y=pts.map(p=>p[1]);
  const h=[], d=[];
  for(let i=0;i<n-1;i++){h[i]=x[i+1]-x[i]; d[i]=(y[i+1]-y[i])/h[i];}
  const m=new Array(n); m[0]=d[0]; m[n-1]=d[n-2];
  for(let i=1;i<n-1;i++){
    if(d[i-1]*d[i]<=0){m[i]=0;}
    else{const w1=2*h[i]+h[i-1], w2=h[i]+2*h[i-1]; m[i]=(w1+w2)/(w1/d[i-1]+w2/d[i]);}
  }
  return v=>{
    const lx=Math.min(Math.max(Math.log10(v),x[0]),x[n-1]);
    let i=0; while(i<n-2 && lx>x[i+1]) i++;
    const t=(lx-x[i])/h[i], t2=t*t, t3=t2*t;
    return (2*t3-3*t2+1)*y[i] + (t3-2*t2+t)*h[i]*m[i] + (-2*t3+3*t2)*y[i+1] + (t3-t2)*h[i]*m[i+1];
  };
}
const pct = makeCurve(ANCHORS);

/* ---------- Вспомогательное ---------- */
const $ = id => document.getElementById(id);
const fmtInt = v => "$" + Math.round(v).toLocaleString("en-US").replace(/,/g," ");
const fmt2 = v => "$" + v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/,/g," ");
const fromSlider = s => MIN*Math.pow(MAX/MIN, s/1000);
const toSlider = v => 1000*Math.log(v/MIN)/Math.log(MAX/MIN);
function nice(v){ return v<50 ? Math.round(v) : v<500 ? Math.round(v/5)*5 : v<2000 ? Math.round(v/10)*10 : Math.round(v/50)*50; }

/* ---------- Подписи ---------- */
$("t_title").textContent=T.title; $("t_sub").textContent=T.sub; $("t_bonus").textContent=T.bonus;
$("t_dep").textContent=T.dep; $("t_dep2").textContent=T.dep; $("t_total").textContent=T.total;
$("cap").textContent=T.cap; $("t_spins").textContent=T.spins; $("t_lim").textContent=T.lim;
$("cta").textContent=T.cta; $("t_note").textContent=T.note;
const promo=$("promo"); promo.textContent=T.promo; promo.href=PROMO_URL;
if(!PROMO_URL || PROMO_URL.indexOf("__")===0) promo.style.display="none";

/* ---------- Кривая на графике ---------- */
const svg=$("curve"), W=400, H=96, PAD=8, YMIN=2.5, YMAX=10.2;
const px = s => (s/1000)*W;
const py = p => H-PAD-((p-YMIN)/(YMAX-YMIN))*(H-2*PAD);
let path="";
for(let s=0;s<=1000;s+=5){ path += (s?"L":"M")+px(s).toFixed(1)+" "+py(pct(fromSlider(s))).toFixed(1)+" "; }
svg.innerHTML =
  '<defs>'+
   '<linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#1E4FD8"/><stop offset="1" stop-color="#7DB6FF"/></linearGradient>'+
   '<linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3D8BFF" stop-opacity=".45"/><stop offset="1" stop-color="#3D8BFF" stop-opacity="0"/></linearGradient>'+
   '<clipPath id="cl"><rect id="clr" x="0" y="0" width="0" height="'+H+'"/></clipPath>'+
  '</defs>'+
  '<path d="'+path+'" fill="none" stroke="rgba(143,166,214,.28)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>'+
  '<g clip-path="url(#cl)"><path d="'+path+'L'+W+' '+H+' L0 '+H+' Z" fill="url(#fg)"/>'+
  '<path d="'+path+'" fill="none" stroke="url(#lg)" stroke-width="3.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/></g>'+
  '<line id="vl" x1="0" x2="0" y1="0" y2="'+H+'" stroke="rgba(191,216,255,.25)" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>';
const dot=document.createElement("div");
dot.style.cssText="position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(61,139,255,.45),0 0 18px #3D8BFF;transform:translate(-50%,-50%);pointer-events:none";
document.querySelector(".curve").appendChild(dot);

/* ---------- Обновление ---------- */
const slider=$("slider");
function render(){
  const s=+slider.value, dep=nice(fromSlider(s)), p=pct(dep), raw=dep*p/100*spins, bonus=Math.min(raw,BONUS_CAP);
  $("bonus").textContent = bonus<100 ? fmt2(bonus) : fmtInt(bonus);
  $("rate").textContent = "≈ " + p.toFixed(1).replace(".",",") + "% " + T.per + (spins>1 ? "  ×  " + spins : "");
  $("dep").textContent = fmtInt(dep); $("dep2").textContent = fmtInt(dep);
  $("total").textContent = fmtInt(dep+bonus);
  slider.style.setProperty("--p", s/10);
  const x=px(s), y=py(pct(fromSlider(s)));
  $("clr").setAttribute("width",x); $("vl").setAttribute("x1",x); $("vl").setAttribute("x2",x);
  const box=document.querySelector(".curve").getBoundingClientRect();
  dot.style.left=(x/W*box.width)+"px"; dot.style.top=(y/H*box.height)+"px";
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",Math.abs(+c.dataset.s-s)<6));
  if(tg && tg.HapticFeedback && render.last!==dep && Math.abs((render.hap||0)-s)>12){ tg.HapticFeedback.selectionChanged(); render.hap=s; }
  $("cap").classList.toggle("hit",raw>=BONUS_CAP);
  document.querySelectorAll("#sp button").forEach(b=>b.classList.toggle("on",+b.dataset.n===spins));
  render.last=dep;
}
slider.addEventListener("input",render);
window.addEventListener("resize",render);

/* Быстрые суммы с плавным движением ползунка */
[10,100,1000,10000].forEach(v=>{
  const b=document.createElement("button"); b.className="chip"; b.dataset.s=toSlider(v);
  b.textContent=v>=1000 ? "$"+(v/1000)+"k" : "$"+v;
  b.onclick=()=>glide(toSlider(v));
  $("chips").appendChild(b);
});
let raf;
function glide(target){
  cancelAnimationFrame(raf);
  const from=+slider.value, t0=performance.now(), dur=window.matchMedia("(prefers-reduced-motion:reduce)").matches?0:450;
  (function step(now){
    const k=dur?Math.min((now-t0)/dur,1):1, e=1-Math.pow(1-k,3);
    slider.value=from+(target-from)*e; render();
    if(k<1) raf=requestAnimationFrame(step);
  })(t0);
}

for(let n=1;n<=MAX_SPINS;n++){
  const b=document.createElement("button"); b.dataset.n=n; b.textContent=n;
  b.onclick=()=>{ spins=Math.min(n,MAX_SPINS); if(tg&&tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); render(); };
  $("sp").appendChild(b);
}

$("cta").onclick=()=>{
  const url = (CTA_URL && CTA_URL.indexOf("__")!==0) ? CTA_URL : REF_LINK;
  if(tg && /^https:\/\/t\.me\//.test(url) && tg.openTelegramLink) tg.openTelegramLink(url);
  else if(tg && tg.openLink) tg.openLink(url);
  else window.open(url,"_blank");
};

if(tg){ tg.ready(); tg.expand(); try{ tg.setHeaderColor("#040A1E"); tg.setBackgroundColor("#040A1E"); }catch(e){} }
slider.value=toSlider(100);
render();
</script>
</body>
</html>
